<!-- LifeOS Enterprise — Módulo Documentos v8.1 (100% dinâmico) -->
<div id="module-documents" style="display:none">

<!-- ─── DOCUMENTOS ─── -->
<div class="page" id="page-documents">
  <div class="page-header">
    <div>
      <div class="page-title"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg> Documentos</div>
      <div class="page-subtitle">Armazenamento, OCR e assinatura digital</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="docsView('grid')" id="docs-btn-grid"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></button>
      <button class="btn btn-ghost" onclick="docsView('list')" id="docs-btn-list"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg></button>
      <button class="btn btn-ghost" onclick="docsCreateFolder()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg> Nova Pasta</button>
      <button class="btn btn-primary" onclick="docsUpload()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Upload</button>
    </div>
  </div>

  <!-- Barra de busca e filtros -->
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <input type="text" class="form-input" id="docs-search-input" placeholder=" Buscar documentos, conteúdo (OCR)..." style="flex:1;min-width:200px" onkeyup="docsSearch(event)" />
    <select class="form-input" id="docs-type-filter" style="width:auto" onchange="docsLoadCurrent()">
      <option value="">Todos os tipos</option>
      <option value="pdf">PDF</option>
      <option value="png">Imagem</option>
      <option value="doc">Word/Docs</option>
      <option value="xls">Excel/Sheets</option>
      <option value="ppt">Apresentação</option>
    </select>
    <select class="form-input" id="docs-date-filter" style="width:auto" onchange="docsLoadCurrent()">
      <option value="">Qualquer data</option>
      <option value="today">Hoje</option>
      <option value="week">Esta semana</option>
      <option value="month">Este mês</option>
    </select>
  </div>

  <!-- Breadcrumb -->
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:16px;font-size:13px">
    <span style="color:var(--accent);cursor:pointer" onclick="docsGoRoot()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg> Meus Documentos</span>
    <span style="color:var(--text-muted)">/</span>
    <span id="docs-breadcrumb-current" style="color:var(--text-secondary)">Raiz</span>
  </div>

  <!-- KPIs de armazenamento -->
  <div class="grid-4" style="margin-bottom:20px" id="docs-kpi-container">
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:rgba(99,102,241,0.15);color:var(--accent)"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg></div>
      <div class="kpi-value" id="docs-kpi-storage">—</div>
      <div class="kpi-label">Usado de 10 GB</div>
      <div class="progress-bar" style="margin-top:6px"><div class="progress-fill" id="docs-storage-bar" style="width:0%"></div></div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:rgba(239,68,68,0.15);color:var(--red)"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></div>
      <div class="kpi-value" id="docs-kpi-total">—</div>
      <div class="kpi-label">Documentos</div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:rgba(16,185,129,0.15);color:var(--green)"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
      <div class="kpi-value" id="docs-kpi-favorites">—</div>
      <div class="kpi-label">Favoritos</div>
    </div>
    <div class="card kpi-card">
      <div class="kpi-icon" style="background:rgba(245,158,11,0.15);color:var(--amber)"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg></div>
      <div class="kpi-value" id="docs-kpi-trash">—</div>
      <div class="kpi-label">Na Lixeira</div>
    </div>
  </div>

  <!-- Grade de documentos -->
  <div id="docs-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">
      <div style="font-size:32px;margin-bottom:8px"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg></div>
      <div style="font-size:14px">Carregando documentos...</div>
    </div>
  </div>
</div>

<!-- ─── VISUALIZADOR DE DOCUMENTO ─── -->
<div class="page" id="page-document-viewer">
  <div class="page-header">
    <div>
      <div class="page-title" id="doc-viewer-title">—</div>
      <div class="page-subtitle" id="doc-viewer-subtitle">—</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="showPage('documents')"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Voltar</button>
      <button class="btn btn-ghost" onclick="docDownloadViewer()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Baixar</button>
      <button class="btn btn-ghost" onclick="docShareViewer()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Compartilhar</button>
      <button class="btn btn-primary" onclick="openModal('modal-sign-doc')"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg> Assinar</button>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 300px;gap:16px">
    <!-- Preview do documento -->
    <div class="card" style="min-height:500px;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated)" id="doc-viewer-preview">
      <div style="text-align:center;padding:40px">
        <div style="font-size:64px;margin-bottom:16px"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></div>
        <div style="font-size:18px;font-weight:700;margin-bottom:8px" id="doc-viewer-name-display">—</div>
        <div style="font-size:13px;color:var(--text-secondary);max-width:400px;line-height:1.6">Selecione um documento para visualizar.</div>
      </div>
    </div>
    <!-- Painel lateral -->
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card">
        <div class="card-title">Informações</div>
        <div style="display:flex;flex-direction:column;gap:8px;font-size:13px" id="doc-viewer-info">
          <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Tipo</span><span id="doc-viewer-type">—</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Tamanho</span><span id="doc-viewer-size">—</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Criado</span><span id="doc-viewer-created">—</span></div>
          <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">Favorito</span><span id="doc-viewer-favorite">—</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Ações</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn btn-ghost" style="width:100%;font-size:12px" onclick="docRenameViewer()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg> Renomear</button>
          <button class="btn btn-ghost" style="width:100%;font-size:12px" onclick="docEditViewer()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg> Editar</button>
          <button class="btn btn-ghost" style="width:100%;font-size:12px" onclick="docUploadNewVersion()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg> Nova versão</button>
          <button class="btn btn-ghost" style="width:100%;font-size:12px" onclick="docMoveViewer()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg> Mover</button>
          <button class="btn btn-ghost" style="width:100%;font-size:12px" onclick="docToggleFavoriteViewer()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg> Favoritar</button>
          <button class="btn btn-ghost" style="width:100%;font-size:12px" onclick="docCopyViewer()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg> Copiar</button>
          <button class="btn btn-ghost" style="width:100%;font-size:12px;color:var(--red)" onclick="docDeleteViewer()"><svg  class="pg-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></svg> Excluir</button>
        </div>
      </div>
    </div>
  </div>
</div>

</div>
<!-- END module-documents -->
